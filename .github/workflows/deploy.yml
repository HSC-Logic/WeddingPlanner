name: Deploy Vow Planner

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: wedding-planner-vps-deployment
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: >-
          npx prettier --check
          "src/**/*.{ts,tsx,css}"
          index.html vite.config.ts playwright.config.ts package.json
          .github/workflows/deploy.yml docs README.md

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Test SSH connection
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.VPS_DEPLOY_HOST }}
          username: ${{ vars.VPS_DEPLOY_USER }}
          key: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          port: 10030
          script: |
            echo "SSH connection successful"
            whoami
            hostname

      - name: Prepare deployment directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.VPS_DEPLOY_HOST }}
          username: ${{ vars.VPS_DEPLOY_USER }}
          key: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          port: 10030
          script: |
            mkdir -p /var/www/wedding-planner
            rm -rf /var/www/wedding-planner/*

      - name: Upload build
        uses: appleboy/scp-action@v1
        with:
          host: ${{ vars.VPS_DEPLOY_HOST }}
          username: ${{ vars.VPS_DEPLOY_USER }}
          key: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          port: 10030
          source: "dist/*"
          target: "/var/www/wedding-planner"
          strip_components: 1
